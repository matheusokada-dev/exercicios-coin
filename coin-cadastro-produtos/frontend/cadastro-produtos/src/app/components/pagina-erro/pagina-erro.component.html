<main class="error-page">
  <section class="error-card" aria-label="Página de erro">
    <div class="error-illustration" aria-hidden="true">
      <span class="error-mark">!</span>
      <span class="device"></span>
      <span class="lock"></span>
      <span class="key"></span>
    </div>

    <p class="error-code">{{ codigoErro }}</p>
    <h1>{{ tituloErro }}</h1>
    <p class="description">{{ descricaoErro }}</p>

<a routerLink="/" class="btn btn-secondary btn-icon-text back-button">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M19 12H5"></path>
    <path d="m12 19-7-7 7-7"></path>
  </svg>
  Voltar
</a>
  </section>
</main>
