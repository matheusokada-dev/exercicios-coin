<main class="error-page">
  <a routerLink="/" class="btn btn-secondary back-button">Voltar</a>

  <section class="error-card" aria-label="Página não encontrada">
    <div class="error-illustration" aria-hidden="true">
      <span class="error-mark">!</span>
      <span class="device"></span>
      <span class="lock"></span>
      <span class="key"></span>
    </div>

    <p class="error-code">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p class="description">A página que você tentou acessar não existe ou ainda não foi configurada.</p>
  </section>
</main>
