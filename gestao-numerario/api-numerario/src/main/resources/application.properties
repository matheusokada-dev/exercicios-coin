spring.application.name=api-numerario
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# A baseline V1/V2 pressupoe um schema vazio/resetado.
# Nao execute migrations automaticamente apenas por iniciar a aplicacao.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}

app.security.jwt.expiration-minutes=480
app.security.jwt.secret=${JWT_SECRET}
app.security.login.max-failed-attempts=5
app.security.login.lock-duration-minutes=15
