spring.application.name=api-numerario
server.port=8081
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# V4 altera estruturas existentes e exige backup validado. A aplicação não deve
# executar migrations destrutivas apenas por ter sido iniciada.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

app.security.jwt.expiration-minutes=15
app.security.refresh.expiration-hours=8
app.security.login.max-failed-attempts=5
app.security.login.lock-duration-minutes=15
