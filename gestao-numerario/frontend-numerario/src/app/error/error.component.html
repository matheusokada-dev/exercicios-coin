<main class="error-page">
  <section class="error-card" aria-label="Página de erro">
    <div class="error-icon" aria-hidden="true">
      <lucide-icon [img]="icon" [size]="52" [strokeWidth]="1.6" />
    </div>

    <p class="error-code">{{ content.code }}</p>
    <h1>{{ content.title }}</h1>
    <p class="description">{{ content.description }}</p>

    <a [routerLink]="backLink" class="btn btn-secondary back-button">
      <lucide-icon [img]="ArrowLeft" [size]="19" aria-hidden="true" />
      Voltar ao início
    </a>
  </section>
</main>
