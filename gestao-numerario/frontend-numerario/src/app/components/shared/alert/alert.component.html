<section
  class="brad-alert"
  [class]="'brad-alert brad-alert--' + type"
  [attr.role]="type === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="type === 'error' ? 'assertive' : 'polite'">
  <lucide-icon
    class="brad-alert__icon"
    [img]="icon"
    [size]="20"
    aria-hidden="true" />
  <div class="brad-alert__content">
    @if (title) {
      <strong>{{ title }}</strong>
    }
    <p>{{ message }}</p>
  </div>
  <ng-content />
</section>
