<app-page-header title="Registrar movimentação" description="Registre uma entrada ou saída operacional de numerário."
  backTo="/movimentacoes" [breadcrumbs]="breadcrumbs" />
@if(erro){<app-alert type="error" [message]="erro" />}
<section class="form-panel"><h2>Dados da movimentação</h2><div class="form">
  <label class="field"><span>Agência</span><select [(ngModel)]="nova.agenciaId">
    <option value="">Selecione uma agência</option>
    @for(agencia of agencias;track agencia.id){<option [ngValue]="agencia.id">{{agencia.codigo}} — {{agencia.nome}}</option>}
  </select></label>
  <label class="field"><span>Tipo</span><select [(ngModel)]="nova.tipo">
    <option value="SAQUE">Saque</option><option value="DEPOSITO">Depósito</option>
    <option value="RECOLHIMENTO">Recolhimento</option><option value="AJUSTE">Ajuste</option>
  </select></label>
  @if(nova.tipo==='AJUSTE'){<label class="field"><span>Direção do ajuste</span>
    <select [(ngModel)]="nova.entradaAjuste"><option [ngValue]="null">Selecione</option>
      <option [ngValue]="true">Entrada</option><option [ngValue]="false">Saída</option></select></label>}
  <label class="field"><span>Valor</span><input appCurrencyInput [(ngModel)]="nova.valor" inputmode="numeric"></label>
  <label class="field field--wide"><span>Descrição</span><input [(ngModel)]="nova.descricao" maxlength="500"></label>
  <button type="button" (click)="salvar()" [disabled]="salvando">Registrar movimentação</button>
  <button type="button" class="outline" (click)="voltar()">Cancelar</button>
</div></section>
<app-confirmation-dialog #confirmacao title="Confirmar movimentação"
  message="Confirma o registro desta movimentação?" confirmLabel="Registrar"
  (confirmed)="confirmarRegistro()" />
