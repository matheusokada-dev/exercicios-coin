<div class="menu-back"><app-page-back to="/tesouraria" /></div>
<header class="menu-heading"><h1>Movimentações</h1><span aria-hidden="true"></span></header>
<section class="menu-grid menu-grid--actions" aria-label="Opções de movimentações">
  <a class="menu-card" routerLink="/movimentacoes/consultar">
    <span class="menu-card__icon"><lucide-icon [img]="ArrowLeftRight" [size]="18" /></span>
    <span class="menu-card__content"><strong>Consultar movimentações</strong></span>
    <lucide-icon class="menu-card__chevron" [img]="ChevronRight" [size]="16" />
  </a>
  <a class="menu-card" routerLink="/movimentacoes/nova">
    <span class="menu-card__icon"><lucide-icon [img]="PlusCircle" [size]="18" /></span>
    <span class="menu-card__content"><strong>Registrar movimentação</strong></span>
    <lucide-icon class="menu-card__chevron" [img]="ChevronRight" [size]="16" />
  </a>
</section>
