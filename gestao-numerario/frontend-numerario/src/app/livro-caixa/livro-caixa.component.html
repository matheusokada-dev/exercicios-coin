<div class="page-navigation">
  <p class="crumb">
    <a routerLink="/menu">COIN Home</a> /
    <a routerLink="/tesouraria">Tesouraria</a> /
    Livro Caixa
  </p>
  <app-page-back to="/tesouraria" />
</div>

<header class="report-heading">
  <h1>Livro Caixa</h1>
  <p>Selecione a agência e o período para gerar o relatório Excel.</p>
</header>

<form class="report-form" (ngSubmit)="gerar()">
  <label>
    Agência
    <select name="agencia" [(ngModel)]="agenciaId" required>
      <option value="">Selecione</option>
      @for (agencia of agencias; track agencia.id) {
        <option [value]="agencia.id">{{ agencia.codigo }} - {{ agencia.nome }}</option>
      }
    </select>
  </label>
  <label>
    Data inicial
    <input name="dataInicio" type="date" [(ngModel)]="dataInicio" required />
  </label>
  <label>
    Data final
    <input name="dataFim" type="date" [(ngModel)]="dataFim" required />
  </label>
  <button type="submit" [disabled]="gerando || !agencias.length">
    <lucide-icon [img]="Download" [size]="18" aria-hidden="true" />
    {{ gerando ? 'Gerando...' : 'Gerar Excel' }}
  </button>
</form>

@if (erro) {
  <p class="form-error">{{ erro }}</p>
}
